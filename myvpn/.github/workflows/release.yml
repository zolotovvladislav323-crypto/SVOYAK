name: Android Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK
      run: |
        NDK_VER="28.2.13676358"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;$NDK_VER"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV

    - name: Build libhevtun (if exists)
      run: |
        bash compile-hevtun.sh || true
        mkdir -p app/libs
        cp -r libs/* app/libs/ || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.keystore

    - name: Build with Gradle
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$PWD/release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Prepare Release Assets
      run: |
        mkdir -p release-apks
        find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-apks/ \;
        cd release-apks
        sha256sum *.apk > sha256sum.txt

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: |
          release-apks/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
